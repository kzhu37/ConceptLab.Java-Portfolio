name: Diagnose ConceptLab production AI

on:
  push:
    paths:
      - ".github/workflows/diagnose-production-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production bridge and Git deployment safely
        run: |
          node <<'NODE'
          const candidates = [
            "https://conceptlab-browser.vercel.app",
            "https://conceptlab-browser-git-main-xiangseanzhu-7370.vercel.app",
            "https://conceptlab-browser-xiangseanzhu-7370.vercel.app"
          ];

          for (const candidate of candidates) {
            const base = candidate.replace(/\/$/, "");
            try {
              const response = await fetch(`${base}/build-meta.json?diagnostic=${Date.now()}`, {
                cache: "no-store",
                redirect: "manual"
              });
              const text = await response.text();
              console.log(`${base} build-meta HTTP ${response.status}`);
              console.log(text.slice(0, 500));

              const browser = await fetch(`${base}/browser.js?diagnostic=${Date.now()}`, {
                cache: "no-store",
                redirect: "manual"
              });
              const browserText = await browser.text();
              console.log(`${base} browser.js HTTP ${browser.status}; nativeBridge=${browserText.includes("Java_Main_browserApiFetch")}`);
            } catch (error) {
              console.log(`${base} probe failed: ${error?.name || "Error"}: ${error?.message || String(error)}`);
            }
          }

          const base = candidates[0];
          const system = "You are a helpful education assistant. Return ONLY valid JSON.";
          const prompt = [
            "HARD COUNT: questions.len=1 EXACT;",
            "INPUT:title=Newtonian Mechanics;",
            "topic=Newton's Second Law;",
            "Create one concise application-focused mechanics question suitable for a high-school physics StudySet."
          ].join(" ");

          for (const model of ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]) {
            const response = await fetch(`${base}/api/conceptlab/ai`, {
              method: "POST",
              redirect: "follow",
              headers: {
                "Content-Type": "application/json",
                "X-ConceptLab-Client": "browser-v1",
                "Origin": base
              },
              body: JSON.stringify({
                model,
                temperature: 0.2,
                max_tokens: 1000,
                reasoning_effort: "low",
                response_format: { type: "json_object" },
                messages: [
                  { role: "system", content: system },
                  { role: "user", content: prompt }
                ]
              })
            });
            const text = await response.text();
            console.log(`${model} HTTP ${response.status}`);
            console.log(text.slice(0, 500));
          }
          NODE
