name: Diagnose ConceptLab production AI

on:
  push:
    paths:
      - ".github/workflows/diagnose-production-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production bridge safely
        env:
          BASE_URL: https://conceptlab-browser.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL.replace(/\/$/, "");
          const system = "You are a helpful education assistant. Return ONLY valid JSON.";
          const prompt = [
            "HARD COUNT: questions.len=1 EXACT;",
            "INPUT:title=Newtonian Mechanics;",
            "topic=Newton's Second Law;",
            "Create one concise application-focused mechanics question suitable for a high-school physics StudySet."
          ].join(" ");

          const build = await fetch(`${base}/build-meta.json?diagnostic=${Date.now()}`, {
            cache: "no-store",
            redirect: "follow"
          });
          console.log(`build-meta HTTP ${build.status}`);
          if (build.ok) console.log(await build.text());

          for (const model of ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]) {
            const response = await fetch(`${base}/api/conceptlab/ai`, {
              method: "POST",
              redirect: "follow",
              headers: {
                "Content-Type": "application/json",
                "X-ConceptLab-Client": "browser-v1",
                "Origin": base
              },
              body: JSON.stringify({
                model,
                temperature: 0.2,
                max_tokens: 1000,
                reasoning_effort: "low",
                response_format: { type: "json_object" },
                messages: [
                  { role: "system", content: system },
                  { role: "user", content: prompt }
                ]
              })
            });
            const text = await response.text();
            console.log(`${model} HTTP ${response.status}`);
            console.log(text.slice(0, 1200));
          }
          NODE
