name: Verify live ConceptLab browser deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conceptlab-live-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONCEPTLAB_BASE_URL: https://conceptlab-browser.vercel.app

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify public browser, persistence, reset, and production AI
        run: node tests/production-browser-smoke.mjs

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conceptlab-production-browser-evidence
          path: |
            conceptlab-production.png
            conceptlab-production-failure.png
            conceptlab-browser-console-errors.txt
            conceptlab-browser-failure-dom.html
          if-no-files-found: ignore
