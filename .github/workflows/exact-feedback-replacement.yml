name: Exact feedback screenshot replacement

on:
  push:
    branches:
      - exact-feedback-final-v5

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace screenshot with supplied PNG
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 'https://oaisdmntpreastus2.blob.core.windows.net/files/00000000-9f28-81f6-95b5-1dea74e39c0d/raw?se=2026-08-29T03%3A06%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=b234b5f4-8c91-4b36-a6df-bafd1433dd53&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T19%3A31%3A52Z&ske=2026-08-29T19%3A31%3A52Z&sks=b&skv=2026-02-06&sig=qjkIDHuTxpHxVrBSmU3vJ0JlnpocDhYaPfh150DYfy4%3D' -o docs/media/browser-feedback-review.png
          echo '7e3743ad9b8cdbcfab735b40b0f17e36c3c6c023335515db1b3cf5488fc3b22f  docs/media/browser-feedback-review.png' | sha256sum -c -
          test "$(stat -c%s docs/media/browser-feedback-review.png)" = "117549"
          rm .github/workflows/exact-feedback-replacement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace feedback screenshot with supplied image"
          git push origin HEAD:exact-feedback-final-v5
