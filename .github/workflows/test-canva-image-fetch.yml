name: Test high-resolution screenshot fetch

on:
  push:
    paths:
      - ".github/workflows/test-canva-image-fetch.yml"

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch candidate full-resolution image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1040/quality:100/uri:ifs%3A%2F%2FM%2Fc0ef1d22-47bf-42f1-b70e-88fb27f2808d/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAErYLXK9sJ8Mv8GmWyT2Ww1yNVa3RyyhgtXyBj4-dcpe&exp=1787817804&osig=AAAAAAAAAAAAAAAAAAAAAOJB_YI_s-C0CsIgfuhwLYahX__hyMh1t43t8QmgeFlC&signer=media-rpc&x-canva-quality=thumbnail' -o /tmp/test.png
          python3 - <<'PY'
          import struct
          data = open('/tmp/test.png', 'rb').read(24)
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          print(f'dimensions={width}x{height}')
          if (width, height) != (1920, 1040):
              raise SystemExit(f'unexpected dimensions: {width}x{height}')
          PY
