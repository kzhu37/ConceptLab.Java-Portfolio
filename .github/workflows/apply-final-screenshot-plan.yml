name: Apply final ConceptLab screenshot plan

# One-time migration for the selected full-resolution screenshots supplied for the README.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-screenshot-plan.yml

permissions:
  contents: write

jobs:
  apply-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct selected full-resolution screenshots
        shell: bash
        run: |
          set -euo pipefail
          cat .github/screenshots-payload/part-* | base64 --decode > /tmp/conceptlab-screenshots.zip
          echo '4cac3b8329d49e98be382bff219c4fb9c6307a6bad2a419ad675d61f4606773b  /tmp/conceptlab-screenshots.zip' | sha256sum -c -
          unzip -o /tmp/conceptlab-screenshots.zip -d docs/media
          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              'docs/media/app-dashboard.png': (1920, 1040),
              'docs/media/app-create-study-set.png': (1920, 1040),
              'docs/media/app-practice-settings.png': (1920, 1040),
              'docs/media/app-feedback-question.png': (1920, 1040),
              'docs/media/app-feedback-review.png': (1920, 1040),
              'docs/media/browser-live-quiz.png': (1920, 960),
          }
          for filename, dimensions in expected.items():
              data = Path(filename).read_bytes()
              if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{filename} is not a valid PNG')
              width, height = struct.unpack('>II', data[16:24])
              print(f'{filename}: {width}x{height}, {len(data)} bytes')
              if (width, height) != dimensions:
                  raise SystemExit(f'{filename}: expected {dimensions}, got {(width, height)}')
          PY

      - name: Apply README screenshot plan
        run: python3 .github/scripts/apply_final_screenshot_plan.py

      - name: Remove superseded assets and one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/media/conceptlab-dashboard.png
          rm -f docs/media/create-study-set.png
          rm -f docs/media/practice-settings.png
          rm -f docs/media/answer-feedback.png
          rm -f docs/media/browser-production.png
          rm -rf .github/screenshots-payload
          rm -f .github/scripts/fetch_final_screenshots.sh
          rm -f .github/scripts/apply_final_screenshot_plan.py
          rm -f .github/workflows/apply-final-screenshot-plan.yml

      - name: Audit final visual references and writing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'docs/media/app-dashboard.png' README.md
          grep -q 'docs/media/app-feedback-question.png' README.md
          grep -q 'docs/media/browser-live-quiz.png' README.md
          grep -q 'docs/media/app-create-study-set.png' README.md
          grep -q 'docs/media/app-practice-settings.png' README.md
          grep -q 'docs/media/app-feedback-review.png' README.md
          if grep -Eq 'conceptlab-dashboard\.png|create-study-set\.png|practice-settings\.png|answer-feedback\.png|browser-production\.png' README.md; then
            echo 'README still references superseded screenshots.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          forbidden = (chr(0x2013), chr(0x2014))
          bad = []
          for path in [Path('README.md'), *Path('docs').rglob('*.md')]:
              text = path.read_text()
              if any(char in text for char in forbidden):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Long dash punctuation found in: ' + ', '.join(bad))
          PY

      - name: Commit final screenshot presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use high-resolution ConceptLab product screenshots'
          git push origin HEAD:main
