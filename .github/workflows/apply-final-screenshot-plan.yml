name: Apply final ConceptLab screenshot plan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-screenshot-plan.yml

permissions:
  contents: write

jobs:
  apply-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch selected full-resolution screenshots
        run: bash .github/scripts/fetch_final_screenshots.sh

      - name: Apply README screenshot plan
        run: python3 .github/scripts/apply_final_screenshot_plan.py

      - name: Remove superseded assets and one-time helpers
        run: |
          rm -f docs/media/conceptlab-dashboard.png
          rm -f docs/media/create-study-set.png
          rm -f docs/media/practice-settings.png
          rm -f docs/media/answer-feedback.png
          rm -f docs/media/browser-production.png
          rm -f .github/scripts/fetch_final_screenshots.sh
          rm -f .github/scripts/apply_final_screenshot_plan.py
          rm -f .github/workflows/apply-final-screenshot-plan.yml

      - name: Audit final visual references
        run: |
          set -euo pipefail
          grep -q 'docs/media/app-dashboard.png' README.md
          grep -q 'docs/media/app-feedback-question.png' README.md
          grep -q 'docs/media/browser-live-quiz.png' README.md
          grep -q 'docs/media/app-create-study-set.png' README.md
          grep -q 'docs/media/app-practice-settings.png' README.md
          grep -q 'docs/media/app-feedback-review.png' README.md
          if grep -Eq 'conceptlab-dashboard\.png|create-study-set\.png|practice-settings\.png|answer-feedback\.png|browser-production\.png' README.md; then
            echo 'README still references superseded screenshots.' >&2
            exit 1
          fi

      - name: Commit final screenshot presentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use full-resolution ConceptLab product screenshots'
          git push origin HEAD:main
