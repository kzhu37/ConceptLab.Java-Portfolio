name: Finish screenshot update

on:
  push:
    branches:
      - finish-conceptlab-images

permissions:
  contents: write

jobs:
  update-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image support
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build final screenshot assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('docs/media/browser-feedback-review.webp')
          target = Path('docs/media/browser-feedback-review.png')
          with Image.open(source) as image:
              image.save(target, format='PNG')
          PY
          git show 4e8924cdae52931ca950779a38bcea51aa1a1e93:docs/media/answer-feedback.png > docs/media/browser-generated-quiz.png

      - name: Update references and remove superseded assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('docs/media/browser-feedback-review.webp', 'docs/media/browser-feedback-review.png')
          text = text.replace('docs/media/browser-generated-quiz.webp', 'docs/media/browser-generated-quiz.png')
          readme.write_text(text, encoding='utf-8')

          testing = Path('docs/USER_TESTING.md')
          text = testing.read_text(encoding='utf-8')
          text = text.replace('media/browser-feedback-review.webp', 'media/browser-feedback-review.png')
          testing.write_text(text, encoding='utf-8')
          PY
          rm docs/media/browser-feedback-review.webp
          rm docs/media/browser-generated-quiz.webp
          rm .github/workflows/finish-screenshot-update.yml

      - name: Commit clean final tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace ConceptLab screenshots with PNG assets'
          git push origin HEAD:finish-conceptlab-images
