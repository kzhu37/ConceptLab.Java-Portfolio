name: Apply supplied ConceptLab screenshots

on:
  push:
    branches: [exact-image-staging-v4]
    paths: [.github/workflows/apply-drive-screenshots.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download supplied screenshots
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1RvER33R7A3Vgkob50rJncp-wGUk4iEss&export=download&confirm=t' -o docs/media/browser-feedback-review.png
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1mGd-hUKIfhYmuODCXqdQw8FjtLEUwScj&export=download&confirm=t' -o docs/media/browser-generated-quiz.png
          echo '7e3743ad9b8cdbcfab735b40b0f17e36c3c6c023335515db1b3cf5488fc3b22f  docs/media/browser-feedback-review.png' | sha256sum -c -
          echo '1ced008c796a931a7e03bb09c37156ca8bc7a1eed6587182032c12025fcdf43c  docs/media/browser-generated-quiz.png' | sha256sum -c -
      - name: Update references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text().replace('docs/media/browser-feedback-review.webp','docs/media/browser-feedback-review.png').replace('docs/media/browser-generated-quiz.webp','docs/media/browser-generated-quiz.png')
          p.write_text(s)
          p=Path('docs/USER_TESTING.md')
          p.write_text(p.read_text().replace('media/browser-feedback-review.webp','media/browser-feedback-review.png'))
          PY
          rm -f docs/media/browser-feedback-review.webp docs/media/browser-generated-quiz.webp
          rm -f .github/workflows/apply-drive-screenshots.yml
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          echo '7e3743ad9b8cdbcfab735b40b0f17e36c3c6c023335515db1b3cf5488fc3b22f  docs/media/browser-feedback-review.png' | sha256sum -c -
          echo '1ced008c796a931a7e03bb09c37156ca8bc7a1eed6587182032c12025fcdf43c  docs/media/browser-generated-quiz.png' | sha256sum -c -
          grep -q 'docs/media/browser-feedback-review.png' README.md
          grep -q 'docs/media/browser-generated-quiz.png' README.md
          grep -q 'media/browser-feedback-review.png' docs/USER_TESTING.md
          test ! -e docs/media/browser-feedback-review.webp
          test ! -e docs/media/browser-generated-quiz.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace ConceptLab screenshots with supplied PNGs'
          git push origin HEAD:exact-image-staging-v4
