name: Restore ConceptLab logo

on:
  push:
    branches: [main]
    paths:
      - '.github/logo-parts/**'

permissions:
  contents: write

jobs:
  restore-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild uploaded ConceptLab logo
        shell: bash
        run: |
          cat .github/logo-parts/part-001.txt \
              .github/logo-parts/part-002.txt \
              .github/logo-parts/part-003.txt > "$RUNNER_TEMP/conceptlab-logo.b64"
          base64 --decode "$RUNNER_TEMP/conceptlab-logo.b64" > ConceptLabLogo.jpg
          file ConceptLabLogo.jpg

      - name: Commit restored logo and clean staging files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/logo-parts
          rm .github/workflows/restore-conceptlab-logo.yml
          git add ConceptLabLogo.jpg .github
          git commit -m 'docs: restore ConceptLab logo asset'
          git pull --rebase origin main
          git push origin HEAD:main
