name: Verify ConceptLab portfolio

on:
  push:
    branches: [main, browser-deployment]
    paths-ignore:
      - 'docs/media/*.png'
      - 'docs/media/*.webp'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/media/*.png'
      - 'docs/media/*.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conceptlab-portfolio-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Compile desktop application on JDK 21
        run: javac *.java

      - name: Compile verification tools
        run: javac -cp . tests/ConceptLabSelfTest.java tests/GenerationPolicySelfTest.java tests/QuestionAnswerPolicySelfTest.java tests/BrowserSeedSelfTest.java tools/PortfolioCapture.java

      - name: Run core self-tests
        run: java -ea -cp .:tests ConceptLabSelfTest

      - name: Run generation-policy self-tests
        run: java -ea -cp .:tests GenerationPolicySelfTest

      - name: Run question-answer policy self-tests
        run: java -ea -cp .:tests QuestionAnswerPolicySelfTest

      - name: Verify bundled browser demo StudySet
        run: java -ea -cp .:tests BrowserSeedSelfTest

      - name: Build Java 17 CheerpJ artifact from canonical sources
        run: |
          python3 browser/build-browser.py --output ConceptLab-browser.jar
          python3 browser/normalize-jar.py ConceptLab-browser.jar
          jar --list --file ConceptLab-browser.jar | grep -q '^Main.class$'

      - name: Run browser API contract tests
        run: npm test

      - name: Run browser static security checks
        run: npm run verify:static

      - name: Enforce portfolio punctuation policy
        shell: bash
        run: |
          if grep -RInP '[\x{2010}-\x{2015}\x{2E3A}\x{2E3B}]' \
            README.md docs/*.md THIRD_PARTY_NOTICES.md index.html docs/media/*.svg; then
            echo 'Long dash detected in public portfolio writing.'
            exit 1
          fi
          echo 'Public portfolio writing contains no em dashes or en dashes.'

      - name: Scan public tree and browser artifact for Groq-style secrets
        shell: bash
        run: |
          if grep -RInE 'gsk_[A-Za-z0-9_-]{20,}' . --exclude-dir=.git; then
            echo 'Secret-like Groq credential detected in public repository.'
            exit 1
          fi
          if strings ConceptLab-browser.jar | grep -E 'gsk_[A-Za-z0-9_-]{20,}'; then
            echo 'Secret-like Groq credential detected in browser JAR.'
            exit 1
          fi
          echo 'No Groq-style credentials detected.'

      - name: Install virtual display and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick

      - name: Generate fresh UI captures from the real desktop application
        run: |
          mkdir -p "$RUNNER_TEMP/conceptlab-home"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            java -Duser.home="$RUNNER_TEMP/conceptlab-home" -cp .:tools PortfolioCapture

      - name: Frame README captures
        run: |
          convert docs/media/create-study-set.png -crop 1700x860+0+0 +repage docs/media/create-study-set.png

      - name: Upload fresh capture artifact
        uses: actions/upload-artifact@v7
        with:
          name: conceptlab-portfolio-screenshots
          path: docs/media/*.png
          if-no-files-found: error

      - name: Upload verified Java 17 browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: conceptlab-browser-jar
          path: ConceptLab-browser.jar
          if-no-files-found: error
