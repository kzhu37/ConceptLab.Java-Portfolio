name: One-shot Vercel production redeploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Redeploy current source when Vercel credentials are available
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Repository Vercel deployment credentials are unavailable."
            exit 78
          fi
          mkdir -p .vercel
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID
          }));
          NODE
          npx --yes vercel@latest deploy --prod --yes --token="${VERCEL_TOKEN}"
