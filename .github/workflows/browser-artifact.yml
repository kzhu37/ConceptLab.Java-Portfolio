name: Build browser artifact

on:
  push:
    branches: [browser-deployment, main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conceptlab-browser-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sync-browser-jar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 21 compiler
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build deterministic Java 17 CheerpJ artifact
        run: |
          python3 browser/build-browser.py --output ConceptLab-browser.jar
          python3 browser/normalize-jar.py ConceptLab-browser.jar
          jar --list --file ConceptLab-browser.jar | grep -q '^Main.class$'

      - name: Commit verified browser artifact when changed
        shell: bash
        run: |
          git add -f ConceptLab-browser.jar
          if git diff --cached --quiet; then
            echo 'Browser JAR already matches the canonical sources.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh verified browser artifact'
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
