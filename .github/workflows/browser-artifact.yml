name: Build ConceptLab browser artifact

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: conceptlab-browser-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-sync-browser-jar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21 compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Java 17 CheerpJ artifact
        run: |
          python3 browser/build-browser.py --output ConceptLab-browser.jar
          python3 browser/normalize-jar.py ConceptLab-browser.jar

      - name: Run browser API contract tests
        run: npm test

      - name: Run browser static checks
        run: npm run verify:static

      - name: Commit refreshed artifact when needed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ConceptLab-browser.jar)" ]; then
            echo "Committed browser JAR already matches the canonical sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ConceptLab-browser.jar
          git commit -m "build: refresh Java 17 browser artifact"
          git push origin "HEAD:${{ github.head_ref }}"
