name: Harden browser demo seed path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Harden browser demo seed path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update browser seed boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          build = Path('browser/build-browser.py')
          text = build.read_text(encoding='utf-8')
          old = '''            if (!Files.isRegularFile(demoTarget)) {
                Path seed = Paths.get("/str/conceptlab-demo.clab");
                if (!Files.isRegularFile(seed)) {
                    seed = Paths.get("/app/demo/newtonian-mechanics.clab");
                }
                if (Files.isRegularFile(seed)) {
                    Files.copy(seed, demoTarget);
                } else {
                    System.err.println("[ConceptLab][Browser] Demo seed file was not available in /str or /app.");
                }
            }
'''
          new = '''            if (!Files.isRegularFile(demoTarget)) {
                String seedText = null;
                try {
                    seedText = Files.readString(
                            Paths.get("/str/conceptlab-demo.clab"),
                            java.nio.charset.StandardCharsets.UTF_8);
                } catch (Exception ignored) {
                    Path fallbackSeed = Paths.get("/app/demo/newtonian-mechanics.clab");
                    if (Files.isRegularFile(fallbackSeed)) {
                        seedText = Files.readString(
                                fallbackSeed,
                                java.nio.charset.StandardCharsets.UTF_8);
                    }
                }
                if (seedText != null && !seedText.isBlank()) {
                    Files.writeString(
                            demoTarget,
                            seedText,
                            java.nio.charset.StandardCharsets.UTF_8,
                            java.nio.file.StandardOpenOption.CREATE,
                            java.nio.file.StandardOpenOption.TRUNCATE_EXISTING);
                } else {
                    System.err.println("[ConceptLab][Browser] Demo seed content was not available in /str or /app.");
                }
            }
'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one browser seed copy block')
          build.write_text(text.replace(old, new), encoding='utf-8')

          smoke = Path('tests/production-browser-smoke.mjs')
          text = smoke.read_text(encoding='utf-8')
          old = '''  assert.match(browserText, /cheerpjInit/);
  assert.match(browserText, /conceptlab\\.api\\.url/);
'''
          new = '''  assert.match(browserText, /cheerpjInit/);
  assert.match(browserText, /conceptlab\\.api\\.url/);
  assert.match(browserText, /cheerpOSAddStringFile/);
  assert.match(browserText, /\\/str\\/conceptlab-demo\\.clab/);
'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one production browser marker block')
          smoke.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/repair-browser-seed.yml').unlink()
          PY
      - name: Commit repaired browser seed path
        run: |
          git config user.name "Kevin Zhu"
          git config user.email "126812866+kzhu37@users.noreply.github.com"
          git add browser/build-browser.py tests/production-browser-smoke.mjs .github/workflows/repair-browser-seed.yml
          git commit -m "Use staged seed content in browser runtime"
          git push
