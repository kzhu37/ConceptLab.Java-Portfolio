name: Diagnose Vercel build parity

on:
  push:
    paths:
      - ".github/workflows/diagnose-vercel-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Vercel install and build commands
        run: |
          set -euxo pipefail
          java -version
          javac -version
          node --version
          npm --version
          python3 --version
          npm install
          python3 browser/build-browser.py --output ConceptLab-browser.jar
          python3 browser/normalize-jar.py ConceptLab-browser.jar
          npm test
          npm run verify:static
          VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" VERCEL_GIT_COMMIT_REF="main" python3 browser/build-site.py
          test -f dist/index.html
          test -f dist/browser.js
          test -f dist/ConceptLab-browser.jar
          test -f dist/build-meta.json
