name: Refresh ConceptLab portfolio visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-portfolio-visuals.yml'

permissions:
  contents: write

concurrency:
  group: conceptlab-refresh-portfolio-visuals
  cancel-in-progress: false

jobs:
  refresh-visuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CONCEPTLAB_BASE_URL: https://conceptlab-browser.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate fresh desktop product captures
        shell: bash
        run: |
          set -euo pipefail
          javac *.java
          javac -cp . tools/PortfolioCapture.java
          sudo apt-get update
          sudo apt-get install -y xvfb
          mkdir -p "$RUNNER_TEMP/conceptlab-home"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            java -Duser.home="$RUNNER_TEMP/conceptlab-home" -cp .:tools PortfolioCapture

      - name: Capture and verify the live browser edition
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/production-browser-smoke.mjs
          cp conceptlab-production.png docs/media/browser-production.png

      - name: Update README visual presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          replacements = [
              (
                  '<strong>Independently designed and developed</strong> · used or tested by <strong>60+ people</strong> during development',
                  'Used or tested by <strong>60+ people</strong> during development',
              ),
              (
                  '<img src="docs/media/browser-generated-quiz.webp" alt="ConceptLab browser edition showing an application-focused Newtonian Mechanics question and a submitted response in progress">',
                  '<img src="docs/media/browser-production.png" alt="ConceptLab browser edition running the real Java Swing application through CheerpJ">',
              ),
              (
                  'The live browser edition runs the real Swing application and asks users to apply concepts, not only recall them.',
                  'The browser edition runs the real Swing application through CheerpJ, with persistent StudySets and a server-side AI boundary.',
              ),
              (
                  '<img src="docs/media/browser-feedback-review.webp" alt="ConceptLab feedback flow linking an incorrect mechanics response to a relevant PhET simulation and related flashcards" width="650">',
                  '<img src="docs/media/answer-feedback.png" alt="ConceptLab unit-test feedback after an incorrect Newtonian mechanics response" width="650">',
              ),
              (
                  'After an incorrect response, the live application connects the correction to a relevant simulation and related flashcards so the mistake becomes the next review step.',
                  'A submitted response produces immediate correctness feedback and an explanation, turning a mistake into the next review step.',
              ),
              (
                  'The browser quiz and feedback images above are captures from the public production deployment; the separate Playwright smoke workflow also records production browser screenshots as CI artifacts.',
                  'The browser image above is captured from the public production deployment; the separate Playwright smoke workflow also records production browser screenshots as CI artifacts.',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected README text not found: {old[:100]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f docs/media/browser-generated-quiz.webp docs/media/browser-feedback-review.webp

      - name: Commit refreshed visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kevin Zhu'
          git config user.email 'kzhu3@ocdsb.ca'
          git add README.md docs/media
          if git diff --cached --quiet; then
            echo 'Portfolio visuals are already current.'
            exit 0
          fi
          git commit -m 'Finalize ConceptLab portfolio visuals'
          git push origin HEAD:main
