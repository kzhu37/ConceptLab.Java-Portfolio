name: Scrub school framing

on:
  push:
    paths:
      - .github/workflows/scrub-school-framing.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "README.md": [
                  ("turn course material into application-focused practice", "turn learning material into application-focused practice"),
                  ("students could spend hours reviewing notes and memorizing definitions", "people could spend hours reviewing notes and memorizing definitions"),
                  ("A StudySet begins with the student's own source material.", "A StudySet begins with the user's own source material."),
                  ("Testing with other students made clarity and usefulness more important than the feature checklist", "Testing with other users made clarity and usefulness more important than the feature checklist"),
                  ("including classmates, friends, and peers. Several students moved beyond a one-time test and began using it to support their own studying.", "including friends, peers, and other users. Several people moved beyond a one-time test and began using it to support their own learning."),
                  ("testing the product with other students and changing priorities based on what was useful;", "testing the product with other users and changing priorities based on what was useful;"),
              ],
              "docs/USER_TESTING.md": [
                  ("including classmates, friends, and peers", "including friends, peers, and other users"),
                  ("Several students went beyond a one-time test and began using ConceptLab to support their own studying.", "Several people went beyond a one-time test and began using ConceptLab to support their own learning."),
                  ("some classmates, friends, and peers found the project useful enough to continue using it for their own learning", "some friends, peers, and other users found the project useful enough to continue using it for their own learning"),
                  ("a recurring student problem", "a recurring learning problem"),
                  ("Can another student understand the workflow without me explaining every step?", "Can another user understand the workflow without me explaining every step?"),
                  ("Does feedback help a student decide what to review next?", "Does feedback help a user decide what to review next?"),
                  ("Different students wanted different kinds of practice", "Different users wanted different kinds of practice"),
                  ("The testing group included classmates, friends, and peers.", "The testing group included friends, peers, and other users."),
                  ("Several students adopted the project to support their own studying.", "Several people adopted the project to support their own learning."),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {file_name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
      - name: Commit wording update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/USER_TESTING.md
          git commit -m "Remove school framing from portfolio" || exit 0
          git push
