name: Finish school framing scrub

on:
  push:
    paths:
      - .github/workflows/scrub-school-framing.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "README.md": [
                  ("Students can change question count, difficulty, response style, challenge level, whether previously seen prompts should be avoided, and whether correct-answer text should remain unique.", "Users can change question count, difficulty, response style, challenge level, whether previously seen prompts should be avoided, and whether correct-answer text should remain unique."),
              ],
              "docs/USER_TESTING.md": [
                  ("The original presentation work around ConceptLab focused on a recurring learning problem: having notes and recognizing definitions does not guarantee that a student can apply a concept when the context changes.", "Early ConceptLab development focused on a recurring learning problem: having notes and recognizing definitions does not guarantee that someone can apply a concept when the context changes."),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {file_name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
      - name: Commit wording update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/USER_TESTING.md
          git commit -m "Finish school framing scrub" || exit 0
          git push
