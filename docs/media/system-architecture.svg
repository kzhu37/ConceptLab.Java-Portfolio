<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ConceptLab system architecture</title>
  <desc id="desc">Canonical Java sources feed both a JDK 21 desktop application and a Java 17 CheerpJ browser artifact. Desktop StudySets persist under the user home directory and desktop AI calls use environment credentials. The browser build persists StudySets in CheerpJ files and sends AI requests through a same-origin browser bridge to a Vercel function that holds Groq credentials server-side.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#596579"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5a6678; }
      .lane-title { font-size: 18px; font-weight: 700; fill: #142d53; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 13px; fill: #5a6678; }
      .tiny { font-size: 12px; fill: #5a6678; }
      .box { fill: #ffffff; stroke: #c8d1dc; stroke-width: 2; }
      .box-source { fill: #f6f8fb; stroke: #7b8da3; stroke-width: 2; }
      .box-java { fill: #eef4fb; stroke: #315d98; stroke-width: 2; }
      .box-store { fill: #faf7ef; stroke: #c59a43; stroke-width: 2; }
      .box-secure { fill: #eef8f5; stroke: #2d8b77; stroke-width: 2; }
      .lane { fill: #fbfcfe; stroke: #e0e6ee; stroke-width: 2; }
      .shared { fill: #f5f7fa; stroke: #c8d1dc; stroke-width: 2; }
      .arrow { stroke: #596579; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="698" rx="18" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="50" y="56" class="title">One Java application, two execution environments</text>
  <text x="50" y="84" class="subtitle">The desktop sources remain authoritative; the browser edition adapts only runtime, storage, and AI transport boundaries.</text>

  <rect x="370" y="112" width="460" height="88" rx="15" class="box-source"/>
  <text x="600" y="145" text-anchor="middle" class="label">Canonical Java sources</text>
  <text x="600" y="171" text-anchor="middle" class="small">Main · StudySet · Question · models · persistence · validation</text>

  <rect x="45" y="235" width="520" height="330" rx="20" class="lane"/>
  <text x="75" y="270" class="lane-title">Desktop path</text>

  <rect x="90" y="305" width="190" height="76" rx="13" class="box-java"/>
  <text x="185" y="335" text-anchor="middle" class="label">JDK 21</text>
  <text x="185" y="358" text-anchor="middle" class="small">Java/Swing application</text>

  <rect x="330" y="305" width="190" height="76" rx="13" class="box-store"/>
  <text x="425" y="335" text-anchor="middle" class="label">Local StudySets</text>
  <text x="425" y="358" text-anchor="middle" class="small">~/.conceptlab/sets</text>

  <rect x="90" y="435" width="190" height="76" rx="13" class="box-secure"/>
  <text x="185" y="465" text-anchor="middle" class="label">Desktop AI client</text>
  <text x="185" y="488" text-anchor="middle" class="small">Java HTTP Client</text>

  <rect x="330" y="435" width="190" height="76" rx="13" class="box"/>
  <text x="425" y="465" text-anchor="middle" class="label">Groq API</text>
  <text x="425" y="488" text-anchor="middle" class="small">credentials from environment</text>

  <path d="M500 200 V220 H185 V298" class="arrow"/>
  <path d="M280 343 H323" class="arrow"/>
  <path d="M185 381 V428" class="arrow"/>
  <path d="M280 473 H323" class="arrow"/>

  <rect x="635" y="235" width="520" height="330" rx="20" class="lane"/>
  <text x="665" y="270" class="lane-title">Browser path</text>

  <rect x="675" y="300" width="190" height="76" rx="13" class="box-source"/>
  <text x="770" y="329" text-anchor="middle" class="label">build-browser.py</text>
  <text x="770" y="352" text-anchor="middle" class="small">exact browser patch set</text>

  <rect x="915" y="300" width="190" height="76" rx="13" class="box-java"/>
  <text x="1010" y="329" text-anchor="middle" class="label">Java 17 JAR</text>
  <text x="1010" y="352" text-anchor="middle" class="small">CheerpJ Core 4.3</text>

  <rect x="675" y="420" width="190" height="86" rx="13" class="box-store"/>
  <text x="770" y="450" text-anchor="middle" class="label">Browser StudySets</text>
  <text x="770" y="473" text-anchor="middle" class="small">persistent /files storage</text>
  <text x="770" y="493" text-anchor="middle" class="tiny">reset affects only seeded demo</text>

  <rect x="915" y="420" width="190" height="86" rx="13" class="box-secure"/>
  <text x="1010" y="446" text-anchor="middle" class="label">Same-origin AI bridge</text>
  <text x="1010" y="469" text-anchor="middle" class="small">browser.js native boundary</text>
  <text x="1010" y="489" text-anchor="middle" class="tiny">/api/conceptlab/ai</text>

  <path d="M700 200 V220 H770 V293" class="arrow"/>
  <path d="M865 338 H908" class="arrow"/>
  <path d="M1010 376 V397 H770 V413" class="arrow"/>
  <path d="M1010 376 V413" class="arrow"/>

  <rect x="830" y="590" width="300" height="72" rx="13" class="box-secure"/>
  <text x="980" y="619" text-anchor="middle" class="label">Vercel server function → Groq</text>
  <text x="980" y="643" text-anchor="middle" class="small">provider credentials stay server-side</text>
  <path d="M1010 506 V583" class="arrow"/>

  <rect x="70" y="590" width="650" height="72" rx="13" class="shared"/>
  <text x="395" y="619" text-anchor="middle" class="label">Shared behavior across both paths</text>
  <text x="395" y="643" text-anchor="middle" class="small">same Java models · validation · duplicate rules · fallbacks · StudySet format</text>
</svg>
