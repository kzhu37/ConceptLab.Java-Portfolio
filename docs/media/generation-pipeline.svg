<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">ConceptLab generation pipeline</title>
  <desc id="desc">Course material and goals are shaped into prompts, sent to the Groq API, parsed and validated, filtered through model invariants and duplicate checks, converted into StudySet models, and surfaced as flashcards, practice, unit tests, resources, and versioned local persistence. Remote failures can route through deterministic local fallback generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#516173"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5a6678; }
      .box { fill: #ffffff; stroke: #c8d1dc; stroke-width: 2; }
      .box-accent { fill: #f6f8fb; stroke: #7b8da3; stroke-width: 2; }
      .box-output { fill: #faf7ef; stroke: #c59a43; stroke-width: 2; }
      .box-fallback { fill: #fff7f4; stroke: #c56b58; stroke-width: 2; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #5a6678; }
      .arrow { stroke: #516173; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #c56b58; stroke-width: 2.3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="608" rx="18" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="50" y="58" class="title">Engineering the generation pipeline</text>
  <text x="50" y="86" class="subtitle">Treat model output as untrusted external data: shape the request, validate the response, then admit only usable study content.</text>

  <rect x="50" y="135" width="190" height="92" rx="14" class="box-accent"/>
  <text x="145" y="174" text-anchor="middle" class="label">Course material</text>
  <text x="145" y="199" text-anchor="middle" class="small">notes + goals + settings</text>

  <rect x="285" y="135" width="210" height="92" rx="14" class="box"/>
  <text x="390" y="166" text-anchor="middle" class="label">Prompt construction</text>
  <text x="390" y="191" text-anchor="middle" class="small">source chunking</text>
  <text x="390" y="211" text-anchor="middle" class="small">token-aware batching</text>

  <rect x="540" y="135" width="160" height="92" rx="14" class="box-accent"/>
  <text x="620" y="174" text-anchor="middle" class="label">Groq API</text>
  <text x="620" y="199" text-anchor="middle" class="small">key / model retry</text>

  <rect x="745" y="135" width="190" height="92" rx="14" class="box"/>
  <text x="840" y="166" text-anchor="middle" class="label">Parse + validate</text>
  <text x="840" y="191" text-anchor="middle" class="small">strict JSON contract</text>
  <text x="840" y="211" text-anchor="middle" class="small">structural checks</text>

  <rect x="980" y="135" width="170" height="92" rx="14" class="box"/>
  <text x="1065" y="166" text-anchor="middle" class="label">Quality gates</text>
  <text x="1065" y="191" text-anchor="middle" class="small">model invariants</text>
  <text x="1065" y="211" text-anchor="middle" class="small">duplicate filtering</text>

  <path d="M240 181 H278" class="arrow"/>
  <path d="M495 181 H533" class="arrow"/>
  <path d="M700 181 H738" class="arrow"/>
  <path d="M935 181 H973" class="arrow"/>

  <rect x="490" y="300" width="260" height="86" rx="14" class="box-accent"/>
  <text x="620" y="336" text-anchor="middle" class="label">StudySet domain models</text>
  <text x="620" y="362" text-anchor="middle" class="small">validated application data</text>

  <path d="M1065 227 V265 H620 V293" class="arrow"/>

  <rect x="840" y="300" width="250" height="86" rx="14" class="box-fallback"/>
  <text x="965" y="334" text-anchor="middle" class="label">Deterministic fallback</text>
  <text x="965" y="359" text-anchor="middle" class="small">keeps core flows usable</text>

  <path d="M620 227 V258 H965 V293" class="dashed"/>
  <text x="765" y="251" class="small">remote failure</text>
  <path d="M840 343 H758" class="dashed"/>

  <rect x="55" y="465" width="180" height="82" rx="14" class="box-output"/>
  <text x="145" y="501" text-anchor="middle" class="label">Flashcards</text>
  <text x="145" y="526" text-anchor="middle" class="small">concept review</text>

  <rect x="275" y="465" width="180" height="82" rx="14" class="box-output"/>
  <text x="365" y="501" text-anchor="middle" class="label">Practice</text>
  <text x="365" y="526" text-anchor="middle" class="small">fresh questions</text>

  <rect x="495" y="465" width="180" height="82" rx="14" class="box-output"/>
  <text x="585" y="501" text-anchor="middle" class="label">Unit tests</text>
  <text x="585" y="526" text-anchor="middle" class="small">broader assessment</text>

  <rect x="715" y="465" width="180" height="82" rx="14" class="box-output"/>
  <text x="805" y="501" text-anchor="middle" class="label">Resources</text>
  <text x="805" y="526" text-anchor="middle" class="small">related learning links</text>

  <rect x="935" y="465" width="210" height="82" rx="14" class="box-output"/>
  <text x="1040" y="495" text-anchor="middle" class="label">Local persistence</text>
  <text x="1040" y="520" text-anchor="middle" class="small">versioned .clab StudySets</text>

  <path d="M620 386 V420 H145 V458" class="arrow"/>
  <path d="M620 420 H365 V458" class="arrow"/>
  <path d="M620 420 H585 V458" class="arrow"/>
  <path d="M620 420 H805 V458" class="arrow"/>
  <path d="M620 420 H1040 V458" class="arrow"/>
</svg>